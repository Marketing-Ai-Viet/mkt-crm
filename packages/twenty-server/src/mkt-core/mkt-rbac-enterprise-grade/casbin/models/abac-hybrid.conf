# ABAC Hybrid Model (Workspace-Isolated)
# Supports: RBAC + attribute-based conditions
#
# This model extends the basic RBAC model with:
# - Attribute-based conditions in policies
# - Dynamic evaluation using eval()
# - Support for complex business rules
# - Workspace isolation (no domain in policy - schema-per-tenant)
#
# Use cases:
# - Time-based access (temporary permissions)
# - Department hierarchy checks
# - Clearance level requirements
# - Dynamic field-level access
#
# Naming conventions:
# - Subject: user:{uuid} or tpl:{template_key}
# - Object: {entity} or {entity}:{id}
# - Action: read, create, update, delete, etc.
# - Effect: allow or deny
# - Condition: JavaScript expression (evaluated with r.attr context)
#
# Note: Domain/workspace is handled by schema-per-tenant architecture.
# Each workspace has its own isolated mktCasbinRule table.
#
# Example conditions:
# - "r.attr.currentTime >= '2026-01-01' && r.attr.currentTime <= '2026-03-31'"
# - "isDescendant(r.attr.resourceDept, r.attr.userDept)"
# - "r.attr.userClearance >= 3"

[request_definition]
r = sub, obj, act, attr

[policy_definition]
p = sub, obj, act, eft, condition

[role_definition]
# g: user -> role (workspace-scoped by schema isolation)
g = _, _
# g2: resource -> resource group
g2 = _, _

[policy_effect]
# Allow if any allow AND no explicit deny
e = some(where (p.eft == allow)) && !some(where (p.eft == deny))

[matchers]
# Standard RBAC + condition evaluation
# - Role check: r.sub has role p.sub
# - Resource grouping: r.obj belongs to p.obj group (or exact match)
# - Action check: exact match or wildcard
# - Condition: if empty string, pass; otherwise evaluate with request attributes
m = g(r.sub, p.sub) && (g2(r.obj, p.obj) || r.obj == p.obj) && (r.act == p.act || p.act == "*") && (p.condition == "" || eval(p.condition))
