# RBAC with Domains Model
# Supports: role hierarchy, resource grouping, multi-tenant isolation
#
# Model: RBAC with domains (workspaces) + Resource grouping
# - Users are assigned to roles within a specific workspace (domain)
# - Roles can inherit from other roles
# - Resources can be grouped for easier policy management
#
# Naming conventions:
# - Subject: user:{uuid} or tpl:{template_key}
# - Domain: ws:{workspace_uuid} or ws:* for global
# - Object: {entity} or {entity}:{id}
# - Action: read, create, update, delete, etc.
# - Effect: allow or deny

[request_definition]
r = sub, dom, obj, act

[policy_definition]
p = sub, dom, obj, act, eft

[role_definition]
# g: user -> role (per domain/workspace)
# Format: g(user, role, domain)
g = _, _, _
# g2: resource -> resource group
# Format: g2(resource, group)
g2 = _, _

[policy_effect]
# Allow if any allow AND no explicit deny
# This implements "deny overrides" - explicit deny takes precedence
e = some(where (p.eft == allow)) && !some(where (p.eft == deny))

[matchers]
# Match: role hierarchy + domain + resource group + action
# - g(r.sub, p.sub, r.dom): Check if request subject has the policy subject's role in the request domain
# - r.dom == p.dom: Domain must match (workspace isolation)
# - g2(r.obj, p.obj): Check if request object belongs to policy object's group
# - r.act == p.act: Action must match
m = g(r.sub, p.sub, r.dom) && r.dom == p.dom && g2(r.obj, p.obj) && r.act == p.act
